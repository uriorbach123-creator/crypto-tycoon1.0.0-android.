name: Build Crypto Tycoon APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'crypto-tycoon-android-project.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: unzip -q crypto-tycoon-android-project.zip

      - name: Build debug APK
        working-directory: crypto-tycoon-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-tycoon-debug-apk
          path: crypto-tycoon-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
